org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official

# URL del PC con XAMPP/artisan serve en la LAN. Cambia esto a la IP de tu PC
# (ipconfig | findstr IPv4) cuando muevas la app a otra oficina/router.
# Se expone como BuildConfig.LAN_URL y aparece como preset en LoginScreen/Settings.
BSLOTTERY_LAN_SERVER_URL=http://192.168.100.159:8000
